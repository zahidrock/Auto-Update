name: IPTV Source Intelligence

on:
  push:
    branches: [main]
    paths:
      - "source_intelligence/src/**"
      - "source_intelligence/config/**"
      - "source_intelligence/requirements.txt"
      - ".github/workflows/source-intelligence.yml"
      - "!source_intelligence/data/**"
      - "!source_intelligence/output/**"
  schedule:
    - cron: "35 20 * * *" # daily 02:35 Bangladesh time
  workflow_dispatch:

concurrency:
  group: source-intelligence
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r source_intelligence/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile source_intelligence/src/main.py
      - name: Run source intelligence
        run: python source_intelligence/src/main.py
      - name: Commit database and generated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source_intelligence/data source_intelligence/output
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Daily source intelligence update"

          # The main branch may change while collection is running.
          # Rebase our generated-data commit onto the latest main and retry
          # normal fast-forward pushes. Never force-push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Generated data pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refreshing main."
            sleep $((attempt * 5))
          done

          echo "Could not push generated data after 5 attempts."
          exit 1
